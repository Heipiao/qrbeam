<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRBeam App Store Screenshots</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0e;
        --surface: #12151a;
        --surface-raised: #181c22;
        --border: #2a3039;
        --text: #f5f7fa;
        --muted: #a4adb9;
        --subtle: #707a88;
        --accent: #58d68d;
        --accent-2: #68e4df;
        --ink: #111418;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .shot {
        position: relative;
        width: 1320px;
        height: 2868px;
        overflow: hidden;
        background:
          radial-gradient(circle at 85% 12%, rgba(88, 214, 141, .12), transparent 32%),
          linear-gradient(180deg, #090b0e 0%, #0b0f13 58%, #07100c 100%);
      }

      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("assets/optical-data-field.png") center bottom / cover no-repeat;
        opacity: .25;
        mix-blend-mode: screen;
      }

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: .22;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.1'/%3E%3C/svg%3E");
      }

      .top {
        position: relative;
        z-index: 5;
        padding: 112px 98px 0;
      }

      .brand { display: flex; align-items: center; gap: 22px; }
      .brand img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
      .brand-name { font-size: 34px; font-weight: 720; letter-spacing: -.5px; }
      .brand-kicker { margin-left: auto; color: var(--accent); font-size: 23px; font-weight: 740; letter-spacing: 3.6px; }

      h1 {
        width: 1120px;
        margin: 108px 0 0;
        font-size: 112px;
        line-height: 1.03;
        letter-spacing: -5.2px;
        font-weight: 790;
      }
      .en h1 { font-size: 106px; letter-spacing: -5.7px; line-height: .99; }
      .lead {
        width: 1020px;
        margin-top: 38px;
        color: var(--muted);
        font-size: 42px;
        line-height: 1.42;
        letter-spacing: -.7px;
      }
      .en .lead { font-size: 39px; line-height: 1.4; }
      .accent { color: var(--accent); }

      .scene {
        position: absolute;
        z-index: 3;
        left: 0;
        right: 0;
        top: 880px;
        height: 1740px;
      }

      .bottom-pill {
        position: absolute;
        z-index: 10;
        left: 98px;
        right: 98px;
        bottom: 88px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        border: 1px solid rgba(104, 228, 223, .28);
        border-radius: 999px;
        color: #d9ffef;
        background: rgba(12, 20, 18, .76);
        backdrop-filter: blur(28px);
        font-size: 30px;
        font-weight: 650;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 24px 80px rgba(0, 0, 0, .28);
      }
      .pill-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 24px var(--accent); }

      /* Shared device components */
      .phone {
        position: absolute;
        width: 520px;
        height: 1060px;
        border-radius: 88px;
        padding: 18px;
        background: linear-gradient(145deg, #4b515a, #0f1114 40%, #22272c 82%, #757c84);
        box-shadow: 0 80px 180px rgba(0, 0, 0, .58), inset 0 1px 2px rgba(255,255,255,.5);
      }
      .phone-screen {
        position: relative;
        width: 100%; height: 100%; overflow: hidden;
        border-radius: 72px;
        background: #090b0e;
      }
      .island { position: absolute; z-index: 30; top: 25px; left: 50%; transform: translateX(-50%); width: 154px; height: 46px; border-radius: 28px; background: #030405; }
      .statusbar { height: 78px; padding: 29px 38px 0; display: flex; justify-content: space-between; font-size: 21px; font-weight: 700; }
      .status-icons { display: flex; gap: 10px; color: #fff; }
      .app-header { padding: 38px 36px 22px; }
      .eyebrow { color: var(--accent); font-size: 18px; letter-spacing: 2.4px; font-weight: 760; }
      .app-title { margin-top: 8px; font-size: 38px; font-weight: 760; letter-spacing: -1.2px; }
      .app-subtitle { margin-top: 10px; color: var(--muted); font-size: 20px; line-height: 1.45; }
      .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--border); background: #0e1115; color: var(--subtle); font-size: 15px; }
      .tab { text-align: center; min-width: 78px; }
      .tab-icon { display: block; width: 26px; height: 26px; margin: 0 auto 8px; border: 3px solid currentColor; border-radius: 7px; }
      .tab.active { color: var(--accent); }

      .qr-grid { --q: 17; display: grid; width: 100%; height: 100%; grid-template-columns: repeat(var(--q), 1fr); grid-template-rows: repeat(var(--q), 1fr); gap: 0; background: #fff; padding: 18px; }
      .qr-grid i { background: transparent; }
      .qr-grid i.on { background: #080a0c; }
      .qr-grid i.round-tl { border-radius: 4px 0 0; }

      .scan-screen {
        background:
          linear-gradient(180deg, rgba(4,6,10,.05), rgba(4,6,10,.24)),
          radial-gradient(circle at 52% 38%, rgba(88,214,141,.13), transparent 34%),
          linear-gradient(145deg, #19262a, #0e1418 44%, #1a2027);
      }
      .camera-header { padding: 40px 38px 0; }
      .camera-title { margin-top: 8px; font-size: 32px; font-weight: 760; }
      .scan-box { position: absolute; left: 76px; right: 76px; top: 235px; aspect-ratio: 1; border: 4px solid var(--accent); border-radius: 34px; box-shadow: 0 0 58px rgba(88,214,141,.17); }
      .scan-line { position: absolute; left: 16px; right: 16px; top: 49%; height: 4px; background: var(--accent); box-shadow: 0 0 24px var(--accent); }
      .receive-panel { position: absolute; left: 18px; right: 18px; bottom: 22px; min-height: 320px; padding: 30px; border: 1px solid var(--border); border-radius: 34px; background: rgba(12,15,19,.95); }
      .receive-status { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 18px; font-weight: 650; }
      .receive-status b { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
      .file-name { margin-top: 24px; font-size: 29px; font-weight: 760; }
      .file-meta { margin-top: 10px; color: var(--muted); font-size: 18px; }
      .progress { margin-top: 28px; height: 9px; overflow: hidden; border-radius: 8px; background: var(--border); }
      .progress > b { display: block; height: 100%; width: 68%; border-radius: inherit; background: var(--accent); box-shadow: 0 0 18px rgba(88,214,141,.7); }
      .metrics { display: flex; justify-content: space-between; margin-top: 28px; }
      .metric strong { display: block; font-size: 25px; }
      .metric span { display: block; margin-top: 6px; color: var(--subtle); font-size: 15px; }

      /* Page 1 */
      .page-1 .scene { top: 960px; }
      .laptop { position: absolute; left: -105px; top: 420px; width: 890px; height: 650px; transform: perspective(1800px) rotateY(8deg) rotateZ(-3deg); }
      .laptop-lid { width: 820px; height: 540px; padding: 24px; border-radius: 38px 38px 18px 18px; background: linear-gradient(145deg,#838990,#20252b 9%,#08090b 86%,#6d7379); box-shadow: 0 60px 150px rgba(0,0,0,.55); }
      .laptop-display { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 18px; background: #0b0e12; }
      .browser-bar { height: 55px; padding: 0 24px; display: flex; align-items: center; gap: 12px; color: var(--subtle); border-bottom: 1px solid #232832; background: #12161b; font-size: 15px; }
      .browser-dot { width: 11px; height: 11px; border-radius: 50%; background: #39414c; }
      .browser-url { margin-left: 14px; flex: 1; height: 28px; padding: 5px 14px; border-radius: 8px; background: #0b0e12; }
      .desktop-app { display: flex; height: calc(100% - 55px); padding: 44px; align-items: center; gap: 52px; }
      .desktop-copy { flex: 1; }
      .desktop-copy .mini-brand { color: var(--accent); font-size: 18px; font-weight: 760; letter-spacing: 2px; }
      .desktop-copy h3 { margin: 18px 0 12px; font-size: 34px; line-height: 1.08; }
      .desktop-copy p { margin: 0; color: var(--muted); font-size: 18px; line-height: 1.45; }
      .desktop-qr { width: 300px; height: 300px; flex: none; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 70px rgba(0,0,0,.45); }
      .laptop-base { position: absolute; left: -30px; top: 532px; width: 930px; height: 74px; border-radius: 0 0 42px 42px; background: linear-gradient(180deg,#b4bac0,#4b5158 50%,#24282d); box-shadow: 0 25px 45px rgba(0,0,0,.35); clip-path: polygon(5% 0,95% 0,100% 100%,0 100%); }
      .page-1 .phone { right: 55px; top: 90px; transform: rotate(5deg); }
      .light-path { position: absolute; left: 440px; top: 515px; width: 470px; height: 280px; transform: rotate(-16deg); filter: drop-shadow(0 0 24px rgba(88,214,141,.42)); }
      .light-path::before { content:""; position:absolute; left:0; right:0; top:50%; height:3px; background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent); }
      .particle { position:absolute; width:12px; height:12px; background:var(--accent); border-radius:3px; box-shadow:0 0 18px rgba(88,214,141,.8); }
      .p1{left:8%;top:42%}.p2{left:19%;top:55%;width:7px;height:7px}.p3{left:34%;top:38%}.p4{left:49%;top:56%;width:8px;height:8px}.p5{left:66%;top:41%}.p6{left:81%;top:52%;width:6px;height:6px}.p7{left:93%;top:39%}
      .use-case-card { position: absolute; left: 120px; right: 120px; top: 1240px; display: flex; gap: 18px; }
      .use-case { flex: 1; min-height: 154px; padding: 30px; border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: rgba(15,19,23,.75); backdrop-filter: blur(24px); }
      .use-case strong { display: block; color: var(--accent); font-size: 23px; }
      .use-case span { display: block; margin-top: 12px; color: var(--muted); font-size: 24px; line-height: 1.3; }

      /* Page 2 */
      .page-2 .scene { top: 960px; }
      .page-2 .phone.sender { left: 84px; top: 150px; transform: rotate(-8deg); }
      .page-2 .phone.receiver { right: 65px; top: 360px; transform: rotate(7deg); }
      .sender-screen { background: #f5f3ee; color: var(--ink); }
      .sender-header { padding: 42px 34px 18px; display:flex; justify-content:space-between; color:#505862; font-size:19px; }
      .sender-file { text-align:center; padding: 0 36px; }
      .sender-file strong { display:block; font-size:27px; color:#15181c; }
      .sender-file span { display:block; margin-top:8px; color:#69717b; font-size:17px; }
      .sending-badge { width:max-content; margin:22px auto; padding:12px 22px; border-radius:999px; color:#154c2c; background:#d9f4e3; font-size:17px; font-weight:700; }
      .phone-qr { width:420px; height:420px; margin:0 auto; border:1px solid #ddd8ce; border-radius:26px; overflow:hidden; box-shadow:0 18px 48px rgba(0,0,0,.12); }
      .sender-stats { display:flex; justify-content:space-around; margin:32px 32px 0; text-align:center; }
      .sender-stats strong { display:block; font-size:24px; }
      .sender-stats span { display:block; margin-top:7px; font-size:14px; color:#7a8189; }
      .beam-column { position:absolute; left:550px; top:650px; width:260px; height:240px; transform:rotate(-8deg); }
      .beam-column::after { content:""; position:absolute; left:0; right:0; top:50%; height:4px; background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent); box-shadow:0 0 26px rgba(88,214,141,.8); }
      .step-row { position:absolute; left:90px; right:90px; top:1480px; display:flex; gap:18px; }
      .step { flex:1; padding:26px 20px; border:1px solid rgba(255,255,255,.1); border-radius:26px; background:rgba(12,15,19,.8); text-align:center; }
      .step b { display:flex; align-items:center; justify-content:center; width:42px; height:42px; margin:0 auto 17px; border-radius:50%; color:#0b1310; background:var(--accent); font-size:20px; }
      .step strong { display:block; font-size:22px; }
      .step span { display:block; margin-top:8px; color:var(--muted); font-size:17px; }

      /* Page 3 */
      .page-3 .scene { top: 950px; }
      .page-3 .phone { left: 50%; top: 120px; transform: translateX(-50%); }
      .complete-screen { background:linear-gradient(180deg,#0c1212,#090b0e); }
      .complete-hero { padding: 65px 38px 0; text-align:center; }
      .check-ring { display:flex; align-items:center; justify-content:center; width:122px; height:122px; margin:0 auto 30px; border:3px solid var(--accent); border-radius:50%; color:var(--accent); font-size:68px; box-shadow:0 0 55px rgba(88,214,141,.16); }
      .complete-hero h3 { margin:0; font-size:39px; }
      .complete-hero p { margin:14px 0 0; color:var(--muted); font-size:20px; }
      .complete-card { margin:56px 32px 0; padding:30px; border:1px solid var(--border); border-radius:28px; background:var(--surface); }
      .file-row { display:flex; align-items:center; gap:20px; }
      .file-icon { display:flex; align-items:center; justify-content:center; width:70px; height:84px; border:2px solid var(--accent); border-radius:12px; color:var(--accent); font-size:18px; font-weight:760; }
      .file-info { min-width:0; flex:1; }
      .file-info strong { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:25px; }
      .file-info span { display:block; margin-top:7px; color:var(--muted); font-size:17px; }
      .verify { margin-top:28px; padding-top:24px; border-top:1px solid var(--border); display:flex; justify-content:space-between; color:var(--muted); font-size:17px; }
      .verify b { color:var(--accent); }
      .share-button { margin:32px 32px 0; height:68px; display:flex; align-items:center; justify-content:center; border-radius:18px; background:var(--accent); color:#092114; font-size:20px; font-weight:760; }
      .trust-badge { position:absolute; display:flex; align-items:center; gap:15px; min-height:88px; padding:20px 26px; border:1px solid rgba(104,228,223,.22); border-radius:24px; color:#dfffee; background:rgba(12,20,18,.84); backdrop-filter:blur(24px); box-shadow:0 20px 70px rgba(0,0,0,.34); font-size:22px; font-weight:650; }
      .trust-badge b { display:flex; align-items:center; justify-content:center; width:38px; height:38px; border:2px solid var(--accent); border-radius:12px; color:var(--accent); font-size:22px; }
      .trust-1 { left:70px; top:270px; }
      .trust-2 { right:52px; top:570px; }
      .trust-3 { left:58px; top:1025px; }
      .privacy-caption { position:absolute; left:100px; right:100px; top:1355px; padding:34px; border:1px solid rgba(255,255,255,.09); border-radius:28px; background:rgba(10,13,16,.78); color:var(--muted); font-size:25px; line-height:1.48; text-align:center; }

      @media (max-width: 1320px) { body { transform-origin: top left; } }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script>
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'en' ? 'en' : 'zh';
      const page = Math.min(3, Math.max(1, Number(params.get('page') || 1)));

      const copy = {
        zh: {
          kicker: '离线文件传输',
          pages: [
            {
              title: '没网，<span class="accent">也能传文件</span>',
              lead: '电脑或手机，屏幕对准镜头即可。不同网络、受限网络环境也能传。',
              pill: '无需同一网络 · 无需登录',
            },
            {
              title: '让光，<span class="accent">替你传过去</span>',
              lead: '文件变成动态二维码，逐帧从屏幕传到相机。看得见的光学通道。',
              pill: '屏幕 → 镜头 · 动态二维码传输',
            },
            {
              title: '文件，<span class="accent">不经过云端</span>',
              lead: '无需账号，不上传；接收后在本机校验，再保存或分享。',
              pill: '相机只用于扫描 · 文件留在设备上',
            },
          ],
          app: {
            receiveBrand: '电脑传手机', receiveTitle: '扫描动态二维码', waiting: '正在接收',
            filename: 'Design-brief.pdf', filemeta: '842 KB · 118/174 分块', received: '已接收', fps: '有效 FPS', bad: '错误帧',
            home: '首页', receive: '接收', send: '发送', me: '我的',
            desktopTitle: '从电脑发送', desktopText: '在浏览器中显示动态二维码，用 QRBeam 扫描接收。',
            cases: [['跨系统', '电脑传 iPhone'], ['不同网络', '无需连接同一 Wi-Fi'], ['受限环境', '网络隔离时也能传']],
            exit: '退出', replay: '重播', sending: '正在发送', frame: '当前帧', loops: '循环', actual: '实际 FPS',
            steps: [['选择', '选一个文件'], ['显示', '播放动态二维码'], ['扫描', '另一台设备接收']],
            completed: '文件已接收', verified: '完整性校验通过', size: '842 KB · PDF 文档', sha: 'SHA-256 本机校验', passed: '已通过', share: '分享文件',
            trusts: ['不上传云端', '无需账号', '传输不依赖网络'], privacy: '二维码内容、所选文件和已接收文件都不上传服务器；相机仅用于扫描 QRBeam。',
          }
        },
        en: {
          kicker: 'OFFLINE FILE TRANSFER',
          pages: [
            {
              title: 'Send files<br><span class="accent">without a network</span>',
              lead: 'From computer or phone — simply point the camera at the screen. No shared network needed.',
              pill: 'No shared network · No account',
            },
            {
              title: 'Transfer<br><span class="accent">through light</span>',
              lead: 'Your file becomes animated QR frames, moving optically from screen to camera.',
              pill: 'Screen → camera · Animated QR transfer',
            },
            {
              title: 'Your files stay<br><span class="accent">off the cloud</span>',
              lead: 'No account. No upload. Verified locally before you save or share.',
              pill: 'Camera for scanning only · Files stay on-device',
            },
          ],
          app: {
            receiveBrand: 'COMPUTER TO PHONE', receiveTitle: 'Scan animated QR code', waiting: 'Receiving',
            filename: 'Design-brief.pdf', filemeta: '842 KB · 118/174 chunks', received: 'Received', fps: 'Effective FPS', bad: 'Bad frames',
            home: 'Home', receive: 'Receive', send: 'Send', me: 'Me',
            desktopTitle: 'Send from computer', desktopText: 'Show animated QR frames in the browser. Scan with QRBeam to receive.',
            cases: [['Cross-platform', 'Computer to iPhone'], ['Separate networks', 'No shared Wi-Fi'], ['Restricted setup', 'Works without network access']],
            exit: 'Exit', replay: 'Replay', sending: 'Sending', frame: 'Frame', loops: 'Loops', actual: 'Actual FPS',
            steps: [['Choose', 'Pick a file'], ['Show', 'Play animated QR'], ['Scan', 'Receive on another device']],
            completed: 'File received', verified: 'Integrity check passed', size: '842 KB · PDF document', sha: 'Local SHA-256 check', passed: 'Passed', share: 'Share File',
            trusts: ['No cloud upload', 'No account', 'No transfer network'], privacy: 'Selected files, QR content, and received files are never uploaded. The camera is used only to scan QRBeam.',
          }
        }
      };

      const c = copy[lang];
      const a = c.app;
      document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';

      function qr(seed = 7) {
        const n = 17;
        const cells = [];
        function finder(x, y) {
          const inA = x >= 0 && x < 7 && y >= 0 && y < 7;
          const inB = x >= n - 7 && x < n && y >= 0 && y < 7;
          const inC = x >= 0 && x < 7 && y >= n - 7 && y < n;
          if (!(inA || inB || inC)) return null;
          const lx = inB ? x - (n - 7) : x;
          const ly = inC ? y - (n - 7) : y;
          return lx === 0 || ly === 0 || lx === 6 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
        }
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
          const f = finder(x, y);
          const value = f == null ? ((x * 19 + y * 31 + x * y * 7 + seed * 13) % 11 < 5) : f;
          cells.push(`<i class="${value ? 'on' : ''}"></i>`);
        }
        return `<div class="qr-grid">${cells.join('')}</div>`;
      }

      function receivePhone(extra = '') {
        return `<div class="phone ${extra}"><div class="phone-screen scan-screen"><div class="island"></div><div class="statusbar"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div><div class="camera-header"><div class="eyebrow">${a.receiveBrand}</div><div class="camera-title">${a.receiveTitle}</div></div><div class="scan-box"><div class="scan-line"></div></div><div class="receive-panel"><div class="receive-status"><b></b>${a.waiting}</div><div class="file-name">${a.filename}</div><div class="file-meta">${a.filemeta}</div><div class="progress"><b></b></div><div class="metrics"><div class="metric"><strong>67.8%</strong><span>${a.received}</span></div><div class="metric"><strong>6.0</strong><span>${a.fps}</span></div><div class="metric"><strong>0</strong><span>${a.bad}</span></div></div></div></div></div>`;
      }

      function senderPhone() {
        return `<div class="phone sender"><div class="phone-screen sender-screen"><div class="island"></div><div class="statusbar"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div><div class="sender-header"><span>${a.exit}</span><span>${a.replay}</span></div><div class="sender-file"><strong>${a.filename}</strong><span>842 KB · SAFE</span></div><div class="sending-badge">● ${a.sending}</div><div class="phone-qr">${qr(12)}</div><div class="sender-stats"><div><strong>18/174</strong><span>${a.frame}</span></div><div><strong>2</strong><span>${a.loops}</span></div><div><strong>6.0</strong><span>${a.actual}</span></div></div></div></div>`;
      }

      function completePhone() {
        return `<div class="phone"><div class="phone-screen complete-screen"><div class="island"></div><div class="statusbar"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div><div class="complete-hero"><div class="check-ring">✓</div><h3>${a.completed}</h3><p>${a.verified}</p></div><div class="complete-card"><div class="file-row"><div class="file-icon">PDF</div><div class="file-info"><strong>${a.filename}</strong><span>${a.size}</span></div></div><div class="verify"><span>${a.sha}</span><b>✓ ${a.passed}</b></div></div><div class="share-button">${a.share}</div></div></div>`;
      }

      function pageOne() {
        return `<section class="scene"><div class="laptop"><div class="laptop-lid"><div class="laptop-display"><div class="browser-bar"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><div class="browser-url">127.0.0.1:8765</div></div><div class="desktop-app"><div class="desktop-copy"><div class="mini-brand">QRBEAM</div><h3>${a.desktopTitle}</h3><p>${a.desktopText}</p></div><div class="desktop-qr">${qr(7)}</div></div></div></div><div class="laptop-base"></div></div>${receivePhone()}<div class="light-path">${[1,2,3,4,5,6,7].map(i=>`<i class="particle p${i}"></i>`).join('')}</div><div class="use-case-card">${a.cases.map(x=>`<div class="use-case"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section>`;
      }

      function pageTwo() {
        return `<section class="scene">${senderPhone()}${receivePhone('receiver')}<div class="beam-column"></div><div class="step-row">${a.steps.map((x,i)=>`<div class="step"><b>${i+1}</b><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section>`;
      }

      function pageThree() {
        return `<section class="scene">${completePhone()}${a.trusts.map((x,i)=>`<div class="trust-badge trust-${i+1}"><b>✓</b>${x}</div>`).join('')}<div class="privacy-caption">${a.privacy}</div></section>`;
      }

      const scene = page === 1 ? pageOne() : page === 2 ? pageTwo() : pageThree();
      document.getElementById('root').innerHTML = `<article class="shot page-${page} ${lang}"><div class="grain"></div><header class="top"><div class="brand"><img src="assets/qrbeam-icon.png" alt=""><span class="brand-name">QRBeam</span><span class="brand-kicker">${c.kicker}</span></div><h1>${c.pages[page-1].title}</h1><p class="lead">${c.pages[page-1].lead}</p></header>${scene}<div class="bottom-pill"><i class="pill-dot"></i>${c.pages[page-1].pill}</div></article>`;
    </script>
  </body>
</html>
