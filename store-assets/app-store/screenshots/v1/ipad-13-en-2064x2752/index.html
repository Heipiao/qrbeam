<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRBeam — 13-inch iPad App Store Screenshots</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0e;
        --surface: #12151a;
        --surface2: #181c22;
        --border: #2a3039;
        --text: #f5f7fa;
        --muted: #a4adb9;
        --subtle: #707a88;
        --accent: #58d68d;
        --cyan: #68e4df;
        --ink: #111418;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 2064px; height: 2752px; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--bg); }
      .shot {
        position: relative;
        width: 2064px;
        height: 2752px;
        overflow: hidden;
        background:
          radial-gradient(circle at 86% 9%, rgba(88,214,141,.13), transparent 31%),
          radial-gradient(circle at 9% 52%, rgba(104,228,223,.07), transparent 25%),
          linear-gradient(180deg, #090b0e 0%, #0a0e12 55%, #07100c 100%);
      }
      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("../assets/optical-data-field.png") center bottom / cover no-repeat;
        opacity: .21;
        mix-blend-mode: screen;
      }
      .grain { position: absolute; inset: 0; opacity: .18; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.1'/%3E%3C/svg%3E"); }
      .top { position: relative; z-index: 5; padding: 102px 132px 0; }
      .brand { display: flex; align-items: center; gap: 24px; }
      .brand img { width: 76px; height: 76px; border-radius: 19px; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
      .brand-name { font-size: 36px; font-weight: 740; letter-spacing: -.7px; }
      .brand-kicker { margin-left: auto; color: var(--accent); font-size: 23px; font-weight: 760; letter-spacing: 4px; }
      h1 { width: 1760px; margin: 92px 0 0; font-size: 132px; line-height: .98; letter-spacing: -7px; font-weight: 800; }
      .lead { width: 1450px; margin: 30px 0 0; color: var(--muted); font-size: 39px; line-height: 1.42; letter-spacing: -.7px; }
      .accent { color: var(--accent); }
      .scene { position: absolute; z-index: 3; left: 0; right: 0; top: 730px; height: 1830px; }
      .bottom-pill { position: absolute; z-index: 10; left: 132px; right: 132px; bottom: 70px; height: 104px; display: flex; align-items: center; justify-content: center; gap: 18px; border: 1px solid rgba(104,228,223,.28); border-radius: 999px; background: rgba(12,20,18,.78); color: #d9ffef; font-size: 29px; font-weight: 680; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 80px rgba(0,0,0,.3); }
      .pill-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 24px var(--accent); }

      .qr-grid { --q: 17; display: grid; width: 100%; height: 100%; grid-template-columns: repeat(var(--q), 1fr); grid-template-rows: repeat(var(--q), 1fr); background: #fff; padding: 22px; }
      .qr-grid i { background: transparent; }
      .qr-grid i.on { background: #080a0c; }

      .tablet { position: absolute; padding: 20px; border-radius: 64px; background: linear-gradient(145deg,#69717a,#12151a 13%,#252b31 84%,#7c838b); box-shadow: 0 80px 190px rgba(0,0,0,.58), inset 0 1px 2px rgba(255,255,255,.55); }
      .tablet-screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 46px; background: #090b0e; }
      .camera-dot { position: absolute; z-index: 30; top: 22px; left: 50%; width: 12px; height: 12px; transform: translateX(-50%); border-radius: 50%; background: #020304; box-shadow: inset 0 0 0 3px #17222a; }
      .statusbar { height: 70px; padding: 26px 34px 0; display: flex; justify-content: space-between; font-size: 19px; font-weight: 720; }
      .status-icons { letter-spacing: 7px; }
      .eyebrow { color: var(--accent); font-size: 18px; font-weight: 760; letter-spacing: 2.4px; }
      .screen-title { margin-top: 9px; font-size: 37px; font-weight: 780; letter-spacing: -1.1px; }

      .browser { position: absolute; overflow: hidden; border: 2px solid #414953; border-radius: 35px; background: #0b0e12; box-shadow: 0 70px 160px rgba(0,0,0,.55); }
      .browser-bar { height: 74px; padding: 0 28px; display: flex; align-items: center; gap: 12px; color: var(--subtle); border-bottom: 1px solid #282e37; background: #15191e; font-size: 18px; }
      .browser-dot { width: 13px; height: 13px; border-radius: 50%; background: #3c444f; }
      .browser-url { margin-left: 18px; flex: 1; height: 36px; padding: 8px 17px; border-radius: 9px; background: #0b0e12; }
      .browser-content { height: calc(100% - 74px); display: flex; align-items: center; gap: 64px; padding: 64px; }
      .browser-copy { flex: 1; }
      .browser-copy b { color: var(--accent); font-size: 20px; letter-spacing: 2px; }
      .browser-copy h3 { margin: 20px 0 15px; font-size: 48px; line-height: 1.05; }
      .browser-copy p { margin: 0; color: var(--muted); font-size: 22px; line-height: 1.5; }
      .browser-qr { width: 360px; height: 360px; flex: none; overflow: hidden; border-radius: 20px; box-shadow: 0 22px 70px rgba(0,0,0,.42); }

      .scan-screen { background: radial-gradient(circle at 50% 34%, rgba(88,214,141,.13), transparent 34%), linear-gradient(145deg,#19262a,#0e1418 44%,#1a2027); }
      .camera-header { padding: 42px 42px 0; }
      .scan-box { position: absolute; left: 98px; right: 98px; top: 210px; aspect-ratio: 1; border: 4px solid var(--accent); border-radius: 32px; box-shadow: 0 0 55px rgba(88,214,141,.17); }
      .scan-line { position: absolute; left: 18px; right: 18px; top: 49%; height: 4px; background: var(--accent); box-shadow: 0 0 25px var(--accent); }
      .receive-panel { position: absolute; left: 26px; right: 26px; bottom: 26px; min-height: 300px; padding: 28px; border: 1px solid var(--border); border-radius: 28px; background: rgba(12,15,19,.96); }
      .receive-status { display: flex; align-items: center; gap: 11px; color: var(--muted); font-size: 17px; font-weight: 650; }
      .receive-status b { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
      .file-name { margin-top: 20px; font-size: 29px; font-weight: 760; }
      .file-meta { margin-top: 8px; color: var(--muted); font-size: 17px; }
      .progress { height: 8px; margin-top: 23px; overflow: hidden; border-radius: 8px; background: var(--border); }
      .progress b { display: block; width: 68%; height: 100%; border-radius: inherit; background: var(--accent); }
      .metrics { display: flex; justify-content: space-between; margin-top: 24px; }
      .metric strong { display: block; font-size: 23px; }
      .metric span { display: block; margin-top: 5px; color: var(--subtle); font-size: 14px; }

      .page-1 .browser { left: 110px; top: 360px; width: 1190px; height: 730px; transform: rotate(-3deg); }
      .page-1 .tablet { right: 92px; top: 105px; width: 690px; height: 1130px; transform: rotate(5deg); }
      .light-path { position: absolute; left: 1040px; top: 660px; width: 480px; height: 220px; transform: rotate(-17deg); filter: drop-shadow(0 0 24px rgba(88,214,141,.45)); }
      .light-path::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: linear-gradient(90deg,transparent,var(--accent),var(--cyan),transparent); }
      .particle { position: absolute; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 18px rgba(88,214,141,.85); }
      .p1{left:6%;top:43%}.p2{left:21%;top:56%;width:7px;height:7px}.p3{left:38%;top:38%}.p4{left:53%;top:57%;width:8px;height:8px}.p5{left:70%;top:41%}.p6{left:86%;top:54%;width:7px;height:7px}.p7{left:96%;top:39%}
      .case-row { position: absolute; left: 132px; right: 132px; top: 1330px; display: flex; gap: 22px; }
      .case { flex: 1; min-height: 166px; padding: 31px; border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: rgba(14,18,22,.8); }
      .case strong { display: block; color: var(--accent); font-size: 22px; }
      .case span { display: block; margin-top: 12px; color: var(--muted); font-size: 22px; line-height: 1.35; }

      .sender-screen { background: #f5f3ee; color: var(--ink); }
      .sender-head { padding: 40px 44px 0; display: flex; justify-content: space-between; color: #59616b; font-size: 19px; }
      .sender-file { margin-top: 8px; text-align: center; }
      .sender-file strong { display: block; font-size: 29px; }
      .sender-file span { display: block; margin-top: 6px; color: #747c85; font-size: 17px; }
      .sending { width: max-content; margin: 18px auto; padding: 10px 20px; border-radius: 999px; color: #154c2c; background: #d9f4e3; font-size: 16px; font-weight: 720; }
      .tablet-qr { width: 500px; height: 500px; margin: 0 auto; overflow: hidden; border: 1px solid #ddd8ce; border-radius: 24px; box-shadow: 0 20px 55px rgba(0,0,0,.14); }
      .sender-stats { display: flex; justify-content: space-around; margin: 28px 36px 0; text-align: center; }
      .sender-stats strong { display: block; font-size: 23px; }
      .sender-stats span { display: block; margin-top: 6px; color: #777f88; font-size: 14px; }
      .page-2 .tablet.sender { left: 120px; top: 150px; width: 820px; height: 1200px; transform: rotate(-4deg); }
      .page-2 .tablet.receiver { right: 115px; top: 300px; width: 820px; height: 1200px; transform: rotate(4deg); }
      .beam { position: absolute; left: 805px; top: 720px; width: 450px; height: 200px; transform: rotate(-7deg); }
      .beam::after { content:""; position:absolute; left:0; right:0; top:50%; height:4px; background:linear-gradient(90deg,transparent,var(--accent),var(--cyan),transparent); box-shadow:0 0 27px rgba(88,214,141,.8); }
      .step-row { position: absolute; left: 180px; right: 180px; top: 1580px; display: flex; gap: 24px; }
      .step { flex: 1; padding: 28px 24px; border: 1px solid rgba(255,255,255,.1); border-radius: 26px; background: rgba(12,15,19,.84); text-align: center; }
      .step b { display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; margin: 0 auto 16px; border-radius: 50%; color: #0b1310; background: var(--accent); font-size: 20px; }
      .step strong { display: block; font-size: 23px; }
      .step span { display: block; margin-top: 8px; color: var(--muted); font-size: 17px; }

      .complete-screen { background: linear-gradient(180deg,#0c1212,#090b0e); }
      .complete-hero { padding: 90px 50px 0; text-align: center; }
      .check-ring { display: flex; align-items: center; justify-content: center; width: 132px; height: 132px; margin: 0 auto 27px; border: 3px solid var(--accent); border-radius: 50%; color: var(--accent); font-size: 72px; box-shadow: 0 0 55px rgba(88,214,141,.17); }
      .complete-hero h3 { margin: 0; font-size: 42px; }
      .complete-hero p { margin: 12px 0 0; color: var(--muted); font-size: 19px; }
      .complete-card { margin: 48px 42px 0; padding: 30px; border: 1px solid var(--border); border-radius: 26px; background: var(--surface); }
      .file-row { display: flex; align-items: center; gap: 20px; }
      .file-icon { display: flex; align-items: center; justify-content: center; width: 70px; height: 84px; border: 2px solid var(--accent); border-radius: 12px; color: var(--accent); font-size: 17px; font-weight: 760; }
      .file-info { flex: 1; }
      .file-info strong { display: block; font-size: 25px; }
      .file-info span { display: block; margin-top: 7px; color: var(--muted); font-size: 17px; }
      .verify { margin-top: 26px; padding-top: 23px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--muted); font-size: 17px; }
      .verify b { color: var(--accent); }
      .share { margin: 30px 42px 0; height: 66px; display: flex; align-items: center; justify-content: center; border-radius: 17px; background: var(--accent); color: #092114; font-size: 20px; font-weight: 760; }
      .page-3 .tablet { left: 50%; top: 110px; width: 900px; height: 1320px; transform: translateX(-50%); }
      .trust { position: absolute; display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 22px 28px; border: 1px solid rgba(104,228,223,.22); border-radius: 24px; color: #dfffee; background: rgba(12,20,18,.86); box-shadow: 0 22px 70px rgba(0,0,0,.35); font-size: 23px; font-weight: 670; }
      .trust b { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 2px solid var(--accent); border-radius: 12px; color: var(--accent); font-size: 22px; }
      .trust-1 { left: 120px; top: 350px; }
      .trust-2 { right: 105px; top: 620px; }
      .trust-3 { left: 135px; top: 1040px; }
      .privacy-note { position: absolute; left: 250px; right: 250px; top: 1565px; padding: 33px 42px; border: 1px solid rgba(255,255,255,.09); border-radius: 28px; background: rgba(10,13,16,.8); color: var(--muted); font-size: 23px; line-height: 1.5; text-align: center; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script>
      const page = Math.min(3, Math.max(1, Number(new URLSearchParams(location.search).get('page') || 1)));
      const pages = [
        { title: 'Send files<br><span class="accent">without a network</span>', lead: 'From a computer or another device — no shared Wi-Fi, cloud upload, cable, or account.', pill: 'No shared network · No cloud upload' },
        { title: 'Transfer<br><span class="accent">through light</span>', lead: 'Animated QR frames carry your file optically from screen to camera, one frame at a time.', pill: 'Screen → camera · Animated QR transfer' },
        { title: 'Your files stay<br><span class="accent">off the cloud</span>', lead: 'No account. No file upload. Verified locally before you save or share.', pill: 'Camera for scanning only · Files stay on-device' }
      ];
      function qr(seed = 7) {
        const n = 17, cells = [];
        function finder(x,y) { const a=x<7&&y<7,b=x>=n-7&&y<7,c=x<7&&y>=n-7;if(!(a||b||c))return null;const lx=b?x-(n-7):x,ly=c?y-(n-7):y;return lx===0||ly===0||lx===6||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4); }
        for(let y=0;y<n;y++) for(let x=0;x<n;x++){const f=finder(x,y);const on=f==null?((x*19+y*31+x*y*7+seed*13)%11<5):f;cells.push(`<i class="${on?'on':''}"></i>`)}
        return `<div class="qr-grid">${cells.join('')}</div>`;
      }
      function receiver(extra='') { return `<div class="tablet ${extra}"><div class="tablet-screen scan-screen"><div class="camera-dot"></div><div class="statusbar"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div><div class="camera-header"><div class="eyebrow">COMPUTER TO IPAD</div><div class="screen-title">Scan animated QR code</div></div><div class="scan-box"><div class="scan-line"></div></div><div class="receive-panel"><div class="receive-status"><b></b>Receiving</div><div class="file-name">Design-brief.pdf</div><div class="file-meta">842 KB · 118/174 chunks</div><div class="progress"><b></b></div><div class="metrics"><div class="metric"><strong>67.8%</strong><span>Received</span></div><div class="metric"><strong>6.0</strong><span>Effective FPS</span></div><div class="metric"><strong>0</strong><span>Bad frames</span></div></div></div></div></div>`; }
      function sender() { return `<div class="tablet sender"><div class="tablet-screen sender-screen"><div class="camera-dot"></div><div class="statusbar"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div><div class="sender-head"><span>Exit</span><span>Replay</span></div><div class="sender-file"><strong>Design-brief.pdf</strong><span>842 KB · SAFE</span></div><div class="sending">● Sending</div><div class="tablet-qr">${qr(12)}</div><div class="sender-stats"><div><strong>18/174</strong><span>Frame</span></div><div><strong>2</strong><span>Loops</span></div><div><strong>6.0</strong><span>Actual FPS</span></div></div></div></div>`; }
      function complete() { return `<div class="tablet"><div class="tablet-screen complete-screen"><div class="camera-dot"></div><div class="statusbar"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div><div class="complete-hero"><div class="check-ring">✓</div><h3>File received</h3><p>Integrity check passed</p></div><div class="complete-card"><div class="file-row"><div class="file-icon">PDF</div><div class="file-info"><strong>Design-brief.pdf</strong><span>842 KB · PDF document</span></div></div><div class="verify"><span>Local SHA-256 check</span><b>✓ Passed</b></div></div><div class="share">Share File</div></div></div>`; }
      function first() { return `<section class="scene"><div class="browser"><div class="browser-bar"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><div class="browser-url">127.0.0.1:8765</div></div><div class="browser-content"><div class="browser-copy"><b>QRBEAM</b><h3>Send from computer</h3><p>Show animated QR frames locally in your browser. Scan with QRBeam to receive.</p></div><div class="browser-qr">${qr(7)}</div></div></div>${receiver()}<div class="light-path">${[1,2,3,4,5,6,7].map(i=>`<i class="particle p${i}"></i>`).join('')}</div><div class="case-row"><div class="case"><strong>ON A PLANE</strong><span>Transfer in airplane mode</span></div><div class="case"><strong>RESTRICTED NETWORKS</strong><span>No shared Wi-Fi required</span></div><div class="case"><strong>OFFSHORE & OUTDOORS</strong><span>Works without a signal</span></div></div></section>`; }
      function second() { return `<section class="scene">${sender()}${receiver('receiver')}<div class="beam"></div><div class="step-row"><div class="step"><b>1</b><strong>Choose</strong><span>Pick a small file</span></div><div class="step"><b>2</b><strong>Show</strong><span>Play animated QR</span></div><div class="step"><b>3</b><strong>Scan</strong><span>Receive on another device</span></div></div></section>`; }
      function third() { return `<section class="scene">${complete()}<div class="trust trust-1"><b>✓</b>No cloud upload</div><div class="trust trust-2"><b>✓</b>No account required</div><div class="trust trust-3"><b>✓</b>Local integrity check</div><div class="privacy-note">Selected files, QR content, and camera frames are not uploaded to QRBeam servers. The camera is used only to scan animated QR codes.</div></section>`; }
      const p = pages[page-1];
      const scene = page===1?first():page===2?second():third();
      document.getElementById('root').innerHTML = `<article class="shot page-${page}"><div class="grain"></div><header class="top"><div class="brand"><img src="../assets/qrbeam-icon.png" alt=""><span class="brand-name">QRBeam</span><span class="brand-kicker">OFFLINE FILE TRANSFER</span></div><h1>${p.title}</h1><p class="lead">${p.lead}</p></header>${scene}<div class="bottom-pill"><i class="pill-dot"></i>${p.pill}</div></article>`;
    </script>
  </body>
</html>
